name: Build plugin (Nothing Ear support)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]

env:
  # MagicPodsCore commit the patch was made against. Do not change unless you also redo the patch.
  CORE_REPO: https://github.com/steam3d/MagicPodsCore.git
  CORE_REF: 173245a14beb40fafef3a276da55747a0c0a1c59

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch MagicPodsCore and apply Nothing patch
        run: |
          rm -rf backend/src/MagicPodsCore
          git clone "$CORE_REPO" backend/src/MagicPodsCore
          git -C backend/src/MagicPodsCore checkout "$CORE_REF"
          git -C backend/src/MagicPodsCore apply --check "$GITHUB_WORKSPACE/patches/nothing-ear-a-support.patch"
          git -C backend/src/MagicPodsCore apply "$GITHUB_WORKSPACE/patches/nothing-ear-a-support.patch"
          git -C backend/src/MagicPodsCore status --short

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Decky CLI
        run: |
          mkdir -p cli
          curl -fL -o cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64"
          chmod +x cli/decky

      - name: Build plugin (frontend + C++ backend in Docker)
        run: sudo ./cli/decky plugin build "$(pwd)"

      - name: Check that the zip contains the backend binary
        run: |
          ls -la out
          unzip -l out/*.zip | tee /tmp/zip.txt
          grep -q "bin/magicpodscore" /tmp/zip.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MagicPods-Nothing
          path: out/*.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
