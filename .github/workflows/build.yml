name: Build plugin (Nothing Ear support)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]

env:
  CORE_REPO: https://github.com/steam3d/MagicPodsCore.git

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch MagicPodsCore (commit pinned by the plugin) and apply Nothing patch
        run: |
          # The core commit is whatever the plugin repo pins as its submodule,
          # so syncing the fork with upstream automatically moves the core too.
          CORE_REF=$(git ls-tree HEAD backend/src/MagicPodsCore | awk '{print $3}')
          echo "Pinned MagicPodsCore commit: $CORE_REF"
          rm -rf backend/src/MagicPodsCore
          git clone "$CORE_REPO" backend/src/MagicPodsCore
          git -C backend/src/MagicPodsCore checkout "$CORE_REF"
          if ! git -C backend/src/MagicPodsCore apply --check "$GITHUB_WORKSPACE/patches/nothing-ear-a-support.patch"; then
            echo "::error::The Nothing patch no longer applies to MagicPodsCore $CORE_REF. Upstream changed; the patch must be regenerated."
            exit 1
          fi
          git -C backend/src/MagicPodsCore apply "$GITHUB_WORKSPACE/patches/nothing-ear-a-support.patch"
          git -C backend/src/MagicPodsCore status --short

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Decky CLI
        run: |
          mkdir -p cli
          curl -fL -o cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64"
          chmod +x cli/decky

      - name: Build plugin (frontend + C++ backend and bundled FFmpeg in Docker)
        run: sudo ./cli/decky plugin build "$(pwd)"

      - name: Check that the zip contains the backend binary and bundled libraries
        run: |
          ls -la out
          unzip -l out/*.zip | tee /tmp/zip.txt
          grep -q "bin/magicpodscore" /tmp/zip.txt
          grep -q "bin/lib/libavcodec" /tmp/zip.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MagicPods-Nothing
          path: out/*.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
